<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KoalaClicker test garden</title><style>body{margin:0;padding:60px;background:#171925;color:#f8f8f2;font:18px system-ui}main{max-width:720px}h1{font-size:42px;color:#bd93f9}button,a,input{display:inline-block;padding:18px;margin:10px;border:2px solid #bd93f9;border-radius:10px;background:#282a36;color:#f8f8f2;font:inherit}output{display:block;margin:20px}#covered{position:relative}#cover{position:absolute;inset:0;background:#44475a}svg{background:#44475a;margin:10px}.grid{display:flex;flex-wrap:wrap}</style><main><p>LOCAL DEMO · NO ACCOUNT OR PERSONAL DATA</p><h1>Click garden</h1><p>Select a flower, set an interval, then start. The counter records page clicks.</p><div class="grid"><button id="flower">Grow a flower</button><button id="water">Water the garden</button><button id="duplicate">First duplicate</button><button id="duplicate">Second duplicate</button></div><output id="counter">0 flowers</output><a id="link" href="/navigated">Navigation target</a><form><button id="submit">Submit target</button></form><button id="disabled" disabled>Disabled target</button><div id="covered"><button id="under">Covered target</button><div id="cover">Cover</div></div><div id="shadow"></div><canvas width="100" height="50"></canvas><svg width="100" height="70"><circle id="circle" cx="40" cy="35" r="25"/></svg></main><script>
window.clickEvents=[];for(const type of ["mousedown","mouseup","click"])document.querySelector("#flower").addEventListener(type,e=>clickEvents.push({type,detail:e.detail,buttons:e.buttons,trusted:e.isTrusted}));window.count=0;window.water=0;window.submits=0;window.events=[];
document.querySelector('#flower').addEventListener('click',e=>{count++;document.querySelector('#counter').textContent=count+' flowers';});
document.querySelector('#water').addEventListener('click',()=>water++);
document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();submits++;});
for(const type of ['pointerdown','mousedown','pointerup','mouseup','click'])document.querySelector('#link').addEventListener(type,e=>events.push({type,trusted:e.isTrusted}));
document.querySelector('#shadow').attachShadow({mode:'open'}).innerHTML='<button>Shadow target</button>';
</script></html>
